<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="wh-title wh-desc">
  <title id="wh-title">Bristol and Hyderabad working days on a shared timeline</title>
  <desc id="wh-desc">Two bars on one time axis. Bristol works 09:00 to 17:00 BST; Hyderabad works 09:00 to 17:00 IST, which sits earlier on the shared axis. Each gridline is one hour.</desc>

  <!-- Colours are hardcoded: an SVG loaded through <img> cannot inherit the
       page's CSS custom properties. These match the tokens in styles.css. -->

  <!-- hourly gridlines, 15 hours of shared axis -->
  <g stroke="#363636" stroke-width="1">
    <line x1="170" y1="85" x2="170" y2="295"/>
    <line x1="216.7" y1="85" x2="216.7" y2="295"/>
    <line x1="263.3" y1="85" x2="263.3" y2="295"/>
    <line x1="310" y1="85" x2="310" y2="295"/>
    <line x1="356.7" y1="85" x2="356.7" y2="295"/>
    <line x1="403.3" y1="85" x2="403.3" y2="295"/>
    <line x1="450" y1="85" x2="450" y2="295"/>
    <line x1="496.7" y1="85" x2="496.7" y2="295"/>
    <line x1="543.3" y1="85" x2="543.3" y2="295"/>
    <line x1="590" y1="85" x2="590" y2="295"/>
    <line x1="636.7" y1="85" x2="636.7" y2="295"/>
    <line x1="683.3" y1="85" x2="683.3" y2="295"/>
    <line x1="730" y1="85" x2="730" y2="295"/>
    <line x1="776.7" y1="85" x2="776.7" y2="295"/>
    <line x1="823.3" y1="85" x2="823.3" y2="295"/>
    <line x1="870" y1="85" x2="870" y2="295"/>
  </g>

  <g font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">

    <!-- Bristol: 09:00-17:00 BST -->
    <text x="155" y="143" text-anchor="end" fill="#F5F5F5"
          font-size="22" font-weight="800" letter-spacing="0.5">BRISTOL</text>
    <rect x="403.3" y="110" width="373.4" height="56" rx="10" fill="#3B6FE8"/>
    <text x="403.3" y="100" fill="#8C8C8C" font-size="17" font-weight="700">09:00</text>
    <text x="776.7" y="100" text-anchor="end" fill="#8C8C8C" font-size="17" font-weight="700">17:00</text>

    <!-- Hyderabad: 09:00-17:00 IST, four and a half hours ahead -->
    <text x="155" y="243" text-anchor="end" fill="#F5F5F5"
          font-size="22" font-weight="800" letter-spacing="0.5">HYDERABAD</text>
    <rect x="193.3" y="210" width="373.4" height="56" rx="10" fill="#F2A33C"/>
    <text x="193.3" y="200" fill="#8C8C8C" font-size="17" font-weight="700">09:00</text>
    <text x="566.7" y="200" text-anchor="end" fill="#8C8C8C" font-size="17" font-weight="700">17:00</text>

    <text x="170" y="330" fill="#8C8C8C" font-size="16" font-weight="600">Each gridline is one hour</text>
  </g>
</svg>
